<head>
    <meta charset="utf-8" />
    <title>MonoSafe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style id="page-style">
        * { box-sizing: border-box; }
        html { min-height: 100%; background: #0f1115; color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #f1f3f5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            border: 1px solid #2a2f3a;
            border-radius: 12px;
            background: #171a21;
        }
        h1 { margin: 0; font-size: 24px; letter-spacing: -0.02em; }
        .intro { margin: 8px 0 24px; line-height: 1.5; }
        form { display: grid; gap: 12px; }
        button, input, textarea { font-family: inherit; font-size: inherit; line-height: inherit; }
        :focus-visible { outline: 2px solid #8b7cf6; outline-offset: 2px; }
        /* small composable classes */
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        .muted { color: #9ca3af; }
        .field { padding: 12px 14px; border: 1px solid #343a46; background: #11141a; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 15px; }
        input { display: block; width: 100%; min-height: 48px; border-radius: 8px; }
        textarea { display: block; width: 100%; border-radius: 8px; resize: vertical; }
        .source-options { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 0; padding: 4px; border: 1px solid #343a46; border-radius: 8px; background: #11141a; }
        .source-options label { padding: 8px; border-radius: 5px; text-align: center; cursor: pointer; }
        .source-options label:has(input:checked) { background: #252a34; color: #f1f3f5; }
        .source-options label:focus-within { outline: 2px solid #8b7cf6; outline-offset: 2px; }
        .source-options input { position: absolute; width: 1px; min-height: 1px; opacity: 0; }
        .source-input[hidden] { display: none; }
        #message { min-height: 132px; }
        .message-note, .hint-note { margin: 6px 2px 0; font-size: 13px; line-height: 1.5; }
        .hint-option summary, .password-hint, .trust-notice { font-size: 13px; line-height: 1.5; }
        .trust-notice { margin: 0; }
        .hint-option summary { cursor: pointer; }
        .hint-option textarea { margin-top: 12px; }
        .password-hint { margin: 0; white-space: pre-wrap; overflow-wrap: break-word; }
        .password-field { position: relative; }
        .password-field input { padding-right: 48px; }
        .password-toggle { position: absolute; right: 2px; top: 2px; width: 44px; height: calc(100% - 4px); display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
        .password-toggle:hover { color: #f1f3f5; }
        .password-toggle svg { width: 20px; height: 20px; }
        .eye-slash { display: none; }
        .password-toggle[aria-pressed=true] .eye-slash { display: block; }
        input[type=submit] { border: 0; padding: 12px; background: #6d5ee8; color: white; font-weight: 600; cursor: pointer; }
        input[type=submit]:hover { background: #5e4ed6; }
        input[type=submit]:disabled { opacity: .65; cursor: wait; }
        input[type=file] { padding: 8px; border: 1px solid #343a46; background: #11141a; }
        input[type=file]::file-selector-button { margin-right: 10px; padding: 8px 10px; border: 0; border-radius: 6px; background: #252a34; color: #f1f3f5; font: inherit; font-weight: 600; cursor: pointer; }
        .password-strength, .password-match { font-size: 13px; }
        .strength-lights { display: flex; gap: 8px; }
        .strength-light { width: 9px; height: 9px; flex-shrink: 0; border-radius: 50%; background: #343a46; }
        .password-strength[data-level=low] .strength-light:nth-child(1) { background: #ff8a8a; }
        .password-strength[data-level=medium] .strength-light:nth-child(2) { background: #ffb454; }
        .password-strength[data-level=high] .strength-light:nth-child(3) { background: #76d99b; }
        .password-match[data-match=true] .strength-light { background: #76d99b; }
        .status, noscript { color: #ff8a8a; line-height: 1.5; }
        .status { margin: 16px 0 0; }
        .status[data-tone=info] { color: #9ca3af; }
        .status:empty { margin: 0; }
        noscript { display: block; }
        @media (max-width: 380px) { main { padding: 24px 20px; } }
    </style>
</head>

<body>
    <main>
        <h1>MonoSafe</h1>
        <p class="intro muted">Encrypt a file or text message into a self-decrypting HTML file.</p>
        <noscript>JavaScript is required to encrypt files and messages.</noscript>
        <form id="encrypt-form" style="display:none">
            <fieldset class="source-options" aria-label="Content to encrypt">
                <label class="muted"><input type="radio" id="source-file" name="source" value="file" checked>File</label>
                <label class="muted"><input type="radio" id="source-message" name="source" value="message">Text message</label>
            </fieldset>
            <div class="source-input" id="file-source">
                <input type="file" id="file" aria-label="File to encrypt" autofocus>
            </div>
            <div class="source-input" id="message-source" hidden>
                <label class="visually-hidden" for="message">Text message to encrypt</label>
                <textarea class="field" id="message" rows="5" placeholder="Write a private message"></textarea>
                <p class="muted message-note">The decrypted message will be saved as message.txt.</p>
            </div>
            <label for="password">Password</label>
            <div class="password-field">
                <input type="password" class="field" id="password" autocomplete="new-password" aria-describedby="password-strength-status encrypt-status" required>
                <button type="button" class="muted password-toggle" aria-label="Show password" aria-controls="password" aria-pressed="false" id="password-toggle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                        <circle cx="12" cy="12" r="3" />
                        <path class="eye-slash" d="m3 3 18 18" />
                    </svg>
                </button>
            </div>
            <div class="row muted password-strength" id="password-strength" data-level="empty">
                <span id="password-strength-status" role="status" aria-live="polite" aria-atomic="true"></span>
                <span class="strength-lights" aria-hidden="true">
                    <span class="strength-light"></span>
                    <span class="strength-light"></span>
                    <span class="strength-light"></span>
                </span>
            </div>
            <label for="password_repeated">Repeat password</label>
            <div class="password-field">
                <input type="password" class="field" id="password_repeated" autocomplete="new-password" aria-describedby="password-match-status encrypt-status" required>
                <button type="button" class="muted password-toggle" aria-label="Show repeated password" aria-controls="password_repeated" aria-pressed="false" id="password-repeated-toggle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                        <circle cx="12" cy="12" r="3" />
                        <path class="eye-slash" d="m3 3 18 18" />
                    </svg>
                </button>
            </div>
            <div class="row muted password-match" id="password-match" data-match="false">
                <span id="password-match-status" role="status" aria-live="polite" aria-atomic="true"></span>
                <span class="strength-light" aria-hidden="true"></span>
            </div>
            <details class="hint-option">
                <summary class="muted">Add password hint (optional)</summary>
                <p class="muted hint-note" id="password-hint-note">Not encrypted: anyone who opens the file can read the hint, and anyone can change it without the password.</p>
                <label class="visually-hidden" for="password_hint">Password hint</label>
                <textarea class="field" id="password_hint" rows="2" aria-describedby="password-hint-note" placeholder="A reference to something only we would know"></textarea>
            </details>
            <input id="encrypt-button" type="submit" value="Encrypt">
        </form>
        <p id="encrypt-status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
    <script>
        'use strict';

        function togglePasswordVisibility(button) {
            const input = document.getElementById(button.getAttribute('aria-controls'));
            const visible = input.type === 'password';
            input.type = visible ? 'text' : 'password';
            button.setAttribute('aria-pressed', String(visible));
        }

        for (const id of ['password-toggle', 'password-repeated-toggle']) {
            const button = document.getElementById(id);
            button.addEventListener('click', () => togglePasswordVisibility(button));
        }

        // A lightweight complexity estimate, not a prediction of cracking time.
        function passwordStrength(password) {
            if (!password.length) return 'empty';
            const normalized = password.normalize('NFKC').toLowerCase();
            // Detect passwords dominated by easy-to-guess runs. This
            // also catches concatenated patterns and incomplete final repetitions.
            const patternText = normalized.replace(/[\s!.,_-]+/g, '');
            let remaining = patternText;
            // Keep the second numeric pass: deletions can create new runs
            // whose scan position has already passed (e.g. 12567834 -> 1234).
            const sequences = ['abcdefghijklmnopqrstuvwxyz', '01234567890', '09876543210',
                'qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
            for (const sequence of sequences) {
                for (const direction of [sequence, Array.from(sequence).reverse().join('')]) {
                    for (let length = direction.length; length >= 4; length--) {
                        for (let start = 0; start <= direction.length - length; start++) {
                            remaining = remaining.split(direction.slice(start, start + length)).join('');
                        }
                    }
                }
            }
            remaining = remaining.replace(/[013457@$]/g, character => ({
                '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't',
                '@': 'a', '$': 's'
            })[character]).replace(/password|letmein|welcome|admin|qwerty|iloveyou/g, '');
            let previous;
            do {
                previous = remaining;
                remaining = remaining.replace(/(.{1,32}?)\1+/gu, '');
            } while (remaining !== previous);
            const predictable = remaining.length <= patternText.length / 2;
            const characters = Array.from(normalized.trim().replace(/\s+/g, ' '));
            const unique = new Set(characters).size;
            if (characters.length < 10 || unique < 5 || predictable) return 'low';
            const variety = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^a-zA-Z0-9]/]
                .filter(pattern => pattern.test(password)).length;
            if (characters.length >= 16 && unique >= 8 && (variety >= 2 || characters.length >= 20)) {
                return 'high';
            }
            return 'medium';
        }

        function updatePasswordStrength() {
            const level = passwordStrength(document.getElementById('password').value);
            document.getElementById('password-strength').dataset.level = level;
            document.getElementById('password-strength-status').textContent =
                level === 'empty' ? 'Password strength: not entered' : 'Password strength: ' + level;
        }

        function updatePasswordMatch() {
            const password = document.getElementById('password').value;
            const repeated = document.getElementById('password_repeated').value;
            const matches = password.length > 0 && password === repeated;
            document.getElementById('password-match').dataset.match = String(matches);
            document.getElementById('password-match-status').textContent =
                !password && !repeated ? 'Passwords not entered' :
                !password ? 'Enter a password to check for a match' :
                !repeated ? 'Repeat password to check for a match' :
                matches ? 'Passwords match' : 'Passwords do not match';
        }

        for (const id of ['password', 'password_repeated']) {
            document.getElementById(id).addEventListener('input', updatePasswordMatch);
            document.getElementById(id).addEventListener('change', updatePasswordMatch);
        }
        window.addEventListener('pageshow', updatePasswordMatch);
        updatePasswordMatch();

        document.getElementById('password').addEventListener('input', updatePasswordStrength);
        document.getElementById('password').addEventListener('change', updatePasswordStrength);
        window.addEventListener('pageshow', updatePasswordStrength);
        updatePasswordStrength();

        document.getElementById('encrypt-form').addEventListener('reset', () => {
            setTimeout(() => {
                updatePasswordStrength();
                updatePasswordMatch();
                updateEncryptionSource();
            }, 0);
        });

        function updateEncryptionSource() {
            const messageSelected = document.getElementById('source-message').checked;
            document.getElementById('file-source').hidden = messageSelected;
            document.getElementById('message-source').hidden = !messageSelected;
        }

        for (const id of ['source-file', 'source-message']) {
            document.getElementById(id).addEventListener('change', updateEncryptionSource);
        }
        updateEncryptionSource();

        // Authoritative profile: generated decryptors embed these values, never payload metadata.
        const CRYPTO_PROFILE = Object.freeze({
            kdf: 'PBKDF2',
            hash: 'SHA-256',
            iterations: 600000,
            keySize: 128,
            cipher: 'AES-GCM',
            ivLength: 12
        });

        function getRandomBytes(num) {
            let bytes = new Uint8Array(num);
            window.crypto.getRandomValues(bytes);
            return bytes;
        }

        function containerFilename() {
            const token = Array.from(getRandomBytes(16), byte => byte.toString(16).padStart(2, '0')).join('');
            return 'monosafe-' + token + '.html';
        }

        function readFile(file) {
            const reader = new FileReader();

            return new Promise((resolve, reject) => {
                reader.onerror = () => {
                    reject(reader.error || new DOMException('Cannot read input file.'));
                };

                reader.onload = () => {
                    resolve(new Uint8Array(reader.result));
                };
                reader.readAsArrayBuffer(file);
            });
        };

        function prependFilename(filename, data_bytes) {
            const filename_bytes = new TextEncoder('utf-8').encode(filename + '/');
            const combined_bytes = new Uint8Array(filename_bytes.length + data_bytes.length);
            combined_bytes.set(filename_bytes, 0);
            combined_bytes.set(data_bytes, filename_bytes.length);
            return combined_bytes;
        }

        function deriveKey(password, salt) {
            const passwordBytes = new TextEncoder('utf-8').encode(password);
            return window.crypto.subtle.importKey(
                'raw',
                passwordBytes, {
                    name: CRYPTO_PROFILE.kdf,
                },
                false,
                ['deriveKey']
            ).then(function (key) {
                return window.crypto.subtle.deriveKey({
                        name: CRYPTO_PROFILE.kdf,
                        salt,
                        iterations: CRYPTO_PROFILE.iterations,
                        hash: {
                            name: CRYPTO_PROFILE.hash
                        }
                    },
                    key, {
                        name: CRYPTO_PROFILE.cipher,
                        length: CRYPTO_PROFILE.keySize
                    },
                    false,
                    ['encrypt']
                )
            });
        }

        function encrypt(key, iv, bytes) {
            return window.crypto.subtle.encrypt({
                name: CRYPTO_PROFILE.cipher,
                iv
            }, key, bytes);
        }

        /*
        MIT LICENSE
        Copyright 2011 Jon Leighton
        Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions:
        The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software.
        THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.
        */

        function base64ArrayBuffer(arrayBuffer) {
            let base64 = '';
            const encodings = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

            const bytes = new Uint8Array(arrayBuffer);
            const byteLength = bytes.byteLength;
            const byteRemainder = byteLength % 3;
            const mainLength = byteLength - byteRemainder;

            let a, b, c, d;
            let chunk;

            // Main loop deals with bytes in chunks of 3
            for (var i = 0; i < mainLength; i = i + 3) {
                // Combine the three bytes into a single integer
                chunk = (bytes[i] << 16) | (bytes[i + 1] << 8) | bytes[i + 2];

                // Use bitmasks to extract 6-bit segments from the triplet
                a = (chunk & 16515072) >> 18; // 16515072 = (2^6 - 1) << 18
                b = (chunk & 258048) >> 12; // 258048   = (2^6 - 1) << 12
                c = (chunk & 4032) >> 6; // 4032     = (2^6 - 1) << 6
                d = chunk & 63; // 63       = 2^6 - 1

                // Convert the raw binary segments to the appropriate ASCII encoding;
                base64 += encodings[a] + encodings[b] + encodings[c] + encodings[d];
            }

            // Deal with the remaining bytes and padding
            if (byteRemainder == 1) {
                chunk = bytes[mainLength];

                a = (chunk & 252) >> 2; // 252 = (2^6 - 1) << 2

                // Set the 4 least significant bits to zero
                b = (chunk & 3) << 4; // 3   = 2^2 - 1

                base64 += encodings[a] + encodings[b] + '==';
            } else if (byteRemainder == 2) {
                chunk = (bytes[mainLength] << 8) | bytes[mainLength + 1];

                a = (chunk & 64512) >> 10; // 64512 = (2^6 - 1) << 10
                b = (chunk & 1008) >> 4; // 1008  = (2^6 - 1) << 4

                // Set the 2 least significant bits to zero
                c = (chunk & 15) << 2; // 15    = 2^4 - 1

                base64 += encodings[a] + encodings[b] + encodings[c] + '=';
            }

            return base64;
        }

        function serialize(salt, iv, cipher_buffer, hint) {
            const payload = JSON.stringify({
                salt: Array.prototype.slice.call(salt),
                iv: Array.prototype.slice.call(iv),
                encrypted: base64ArrayBuffer(cipher_buffer),
                hint: hint || undefined
            }).replace(/</g, '\\u003c');
            // Escape script-closing text and preserve literal replacement tokens in hints.
            const decryptor_html = DECRYPTOR_TEMPLATE.replace('{{___PAYLOAD___}}', () => payload);
            return new TextEncoder('utf-8').encode(decryptor_html);
        }

        // Keep the object URL and anchor alive long enough for the browser to begin the download.
        const DOWNLOAD_CLEANUP_DELAY_MS = 10000;

        function download(filename, buffer) {
            const a = document.createElement('a');
            a.style = 'display: none';
            document.body.appendChild(a);
            const blob = new Blob([buffer], {
                type: 'application/octet-stream'
            });
            const url = window.URL.createObjectURL(blob);
            a.href = url;
            a.download = filename;
            a.click();
            setTimeout(() => {
                window.URL.revokeObjectURL(url);
                if (a.parentNode) a.parentNode.removeChild(a);
            }, DOWNLOAD_CLEANUP_DELAY_MS);
        }

        // tone: 'error' (default) or 'info' for progress and success messages.
        function setStatus(message, tone) {
            const status = document.getElementById('encrypt-status');
            status.textContent = message;
            status.dataset.tone = tone || 'error';
        }

        function runEncrypt() {
            setStatus('');

            if (window.isSecureContext === false) {
                setStatus('This insecure context prevents Web Crypto use. Open this page over HTTPS or as a local file in a supported browser.');
                return;
            }
            if (!window.crypto || !window.crypto.subtle) {
                setStatus('Your browser does not support the Web Crypto API.');
                return;
            }

            const messageSelected = document.getElementById('source-message').checked;
            const file = document.getElementById('file').files[0];
            const message = document.getElementById('message').value;
            if (messageSelected && message.length === 0) {
                setStatus('Write a text message first.');
                return;
            }
            if (!messageSelected && !file) {
                setStatus('Select a file first.');
                return;
            }
            const password = document.getElementById('password').value;
            if (password.length === 0) {
                setStatus('Enter a long, unique passphrase before encrypting.');
                return;
            }
            if (password != document.getElementById('password_repeated').value) {
                setStatus('Passwords must match.');
                return;
            }
            const hint = document.getElementById('password_hint').value.trim();

            const encryptButton = document.getElementById('encrypt-button');
            encryptButton.disabled = true;
            setStatus('Encrypting… This may take a few seconds.', 'info');

            const salt = getRandomBytes(16);
            const iv = getRandomBytes(CRYPTO_PROFILE.ivLength);

            const filename = messageSelected ? 'message.txt' : file.name;
            const content = messageSelected
                ? Promise.resolve(new TextEncoder('utf-8').encode(message))
                : readFile(file);

            content
                .then(content_bytes => prependFilename(filename, content_bytes))
                .then(payload_bytes => deriveKey(password, salt)
                    .then(key => encrypt(key, iv, payload_bytes)))
                .then(buffer => serialize(salt, iv, buffer, hint))
                .then(buffer => {
                    const name = containerFilename();
                    download(name, buffer);
                    setStatus('Download started: ' + name, 'info');
                })
                .catch(e => {
                    setStatus('Encryption failed: ' + (e.message || e.name));
                })
                .finally(() => {
                    encryptButton.disabled = false;
                });
        }

        document.getElementById('encrypt-form').addEventListener('submit', e => {
            e.preventDefault();
            runEncrypt();
        });
        document.getElementById('encrypt-form').style.display = 'grid';

        const DECRYPTOR_TEMPLATE =
            `
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>MonoSafe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>${document.getElementById('page-style').textContent}</style>
</head>

<body>
    <main>
        <h1>MonoSafe</h1>
        <p class="intro muted">Enter the password to decrypt this file.</p>
        <noscript>JavaScript is required to decrypt files.</noscript>
        <form id="decrypt-form" style="display:none">
            <label for="password">Password</label>
            <div class="password-field">
                <input id="password" class="field" type="password" autocomplete="current-password" aria-describedby="password-hint trust-notice decrypt-status" autofocus>
                <button type="button" class="muted password-toggle" aria-label="Show password" aria-controls="password" aria-pressed="false" id="password-toggle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                        <circle cx="12" cy="12" r="3" />
                        <path class="eye-slash" d="m3 3 18 18" />
                    </svg>
                </button>
            </div>
            <p class="password-hint muted" id="password-hint" hidden></p>
            <p class="trust-notice muted" id="trust-notice">Only the encrypted contents are protected against tampering. This page, including any password hint, isn't: someone could replace it with a copy that captures your password. Open files only from a source you trust, and use a different password for each file.</p>
            <input id="decrypt-button" type="submit" value="Decrypt">
        </form>
        <p id="decrypt-status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
    <script id="data" type="application/json">
        {{___PAYLOAD___}}
    <\/script>
    <script>
        var CRYPTO_PROFILE = ${JSON.stringify(CRYPTO_PROFILE)};
        var DOWNLOAD_CLEANUP_DELAY_MS = ${DOWNLOAD_CLEANUP_DELAY_MS};

        document.getElementById('password-toggle').addEventListener('click', function () {
            var input = document.getElementById(this.getAttribute('aria-controls'));
            var visible = input.type === 'password';
            input.type = visible ? 'text' : 'password';
            this.setAttribute('aria-pressed', String(visible));
        });

        if (window.crypto && !window.crypto.subtle && window.crypto.webkitSubtle) {
            window.crypto.subtle = window.crypto.webkitSubtle;
        }

        try {
            var hint = JSON.parse(document.getElementById('data').textContent).hint;
            if (typeof hint === 'string' && hint.trim()) {
                var hintElement = document.getElementById('password-hint');
                hintElement.textContent = 'Password hint: ' + hint;
                hintElement.hidden = false;
            }
        } catch (e) {
            // Let the decrypt action report malformed payloads through its existing status.
        }

        function base64ToArray(base64) {
            var binary = atob(base64);
            var bytes = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        function deriveKey(password, salt) {
            var passwordBytes = new TextEncoder('utf-8').encode(password);

            return window.crypto.subtle.importKey(
                'raw',
                passwordBytes, {
                    name: CRYPTO_PROFILE.kdf
                },
                false,
                ['deriveKey']
            ).then(function (key) {
                return window.crypto.subtle.deriveKey({
                        name: CRYPTO_PROFILE.kdf,
                        salt: salt,
                        iterations: CRYPTO_PROFILE.iterations,
                        hash: {
                            name: CRYPTO_PROFILE.hash
                        }
                    },
                    key, {
                        name: CRYPTO_PROFILE.cipher,
                        length: CRYPTO_PROFILE.keySize
                    },
                    false,
                    ['decrypt']
                )
            });
        }

        function decrypt(key, iv, bytes) {
            return window.crypto.subtle.decrypt({
                name: CRYPTO_PROFILE.cipher,
                iv: iv
            }, key, bytes);
        }

        function extractDecryptedFile(buffer) {
            var bytes = new Uint8Array(buffer);
            var slash_pos = Array.prototype.indexOf.call(bytes, '/'.charCodeAt(0));
            if (slash_pos == -1) {
                throw 'Decrypted data is corrupted';
            } else {
                var name = new TextDecoder('utf-8').decode(bytes.subarray(0, slash_pos));
                var content = bytes.subarray(slash_pos + 1);
                return {
                    name: name,
                    content: content
                };
            }
        }

        function download(file) {
            var a = document.createElement('a');
            a.style = 'display: none';
            document.body.appendChild(a);
            var blob = new Blob([file.content]);
            var url = window.URL.createObjectURL(blob);
            a.href = url;
            a.download = file.name;
            a.click();
            // Keep the object URL and anchor alive long enough for the browser to begin the download.
            setTimeout(function () {
                window.URL.revokeObjectURL(url);
                if (a.parentNode) a.parentNode.removeChild(a);
            }, DOWNLOAD_CLEANUP_DELAY_MS);
        }

        // tone: 'error' (default) or 'info' for progress and success messages.
        function setStatus(message, tone) {
            var status = document.getElementById('decrypt-status');
            status.textContent = message;
            status.dataset.tone = tone || 'error';
        }

        function runDecrypt() {
            setStatus('');

            if (window.isSecureContext === false) {
                setStatus('This insecure context prevents Web Crypto use. Open this page over HTTPS or as a local file in a supported browser.');
                return;
            }
            if (!window.crypto || !window.crypto.subtle) {
                setStatus('Your browser does not support the Web Crypto API.');
                return;
            }

            var decryptButton = document.getElementById('decrypt-button');
            decryptButton.disabled = true;
            setStatus('Decrypting… This may take a few seconds.', 'info');

            setTimeout(function () {
                Promise.resolve().then(function () {
                    var data = JSON.parse(document.getElementById('data').textContent);
                    var salt = new Uint8Array(data.salt);
                    var iv = new Uint8Array(data.iv);
                    var encrypted = base64ToArray(data.encrypted);

                    var password = document.getElementById('password').value;
                    return deriveKey(password, salt).then(function (key) {
                        return decrypt(key, iv, encrypted);
                    });
                })
                    .catch(function () {
                        throw 'Wrong password or corrupted file.';
                    })
                    .then(extractDecryptedFile)
                    .then(function (file) {
                        download(file);
                        setStatus('Download started: ' + file.name, 'info');
                    })
                    .catch(function (e) {
                        setStatus('Decryption failed: ' + e);
                    })
                    .then(function () {
                        decryptButton.disabled = false;
                    });
            }, 0);
        }

        document.getElementById('decrypt-form').addEventListener('submit', function(e) {
            e.preventDefault();
            runDecrypt();
        });
        document.getElementById('decrypt-form').style.display = 'grid';
    <\/script>
